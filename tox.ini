[tox]
base_python = python3.12
envlist = py39,py310,py311,py312,py313,docs,lint,typecheck
indexserver =
    default = https://pypi.python.org/simple
toxworkdir = build/tox
skip_missing_interpreters = true

[testenv]
usedevelop = true
extras =
    ci
    msgpack
commands =
    coverage run -m unittest -vb tests.py
    coverage report

[testenv:docs]
extras =
	  dev
commands =
    sphinx-build -b html -aEn docs {envtmpdir}/sphinx

[testenv:lint]
commands =
    ruff check
    ruff format --diff docs examples.py sprockets tests.py

[testenv:typecheck]
commands =
    mypy sprockets/mixins/mediatype/ examples.py tests.py
